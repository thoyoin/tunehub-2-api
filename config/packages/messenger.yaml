framework:
    messenger:
        default_bus: command.bus
        buses:
            query.bus:
            command.bus:
                middleware:
                    - doctrine_transaction
        transports:
            async: '%env(MESSENGER_TRANSPORT_DSN)%'
            failed: '%env(MESSENGER_TRANSPORT_DSN_FAILED)%'

        routing:
             'App\Application\Command\Media\DeleteFileCommand': async
